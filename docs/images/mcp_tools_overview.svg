<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B0F17"/>
      <stop offset="100%" stop-color="#121824"/>
    </linearGradient>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00E676"/>
      <stop offset="50%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1E2638"/>
      <stop offset="100%" stop-color="#151C2A"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="620" rx="16" fill="url(#bgGrad)"/>
  <rect x="1" y="1" width="998" height="618" rx="15" fill="none" stroke="#26334D" stroke-width="1.5"/>

  <!-- Top Title Banner -->
  <rect x="40" y="30" width="920" height="70" rx="12" fill="#161F30" stroke="#2A3B5C" stroke-width="1"/>
  <text x="70" y="62" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="900" fill="#FFFFFF">
    Zerodha AI Platform • Model Context Protocol (MCP) Server
  </text>
  <text x="70" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#00E676">
    PROTOCOL SPECIFICATION v2025-06-18 • SCHEMA-BOUND DETERMINISTIC INTEGRATION
  </text>
  <rect x="830" y="48" width="105" height="32" rx="8" fill="#8B5CF6" fill-opacity="0.15" stroke="#8B5CF6" stroke-width="1"/>
  <text x="882" y="69" text-anchor="middle" font-family="monospace" font-size="11" font-weight="bold" fill="#C4B5FD">7 TOOLS</text>

  <!-- Left: Data Sources & LLM Gateway -->
  <g transform="translate(40, 120)">
    <!-- LLM Node -->
    <rect x="0" y="0" width="200" height="150" rx="14" fill="url(#cardGrad)" stroke="#8B5CF6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="15" width="36" height="36" rx="8" fill="#8B5CF6" fill-opacity="0.2"/>
    <text x="33" y="39" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#A78BFA">🤖</text>
    <text x="60" y="32" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">Gemini AI Engine</text>
    <text x="60" y="48" font-family="monospace" font-size="10" fill="#94A3B8">gemini-1.5-flash</text>
    <text x="15" y="85" font-family="sans-serif" font-size="11" fill="#CBD5E1">Receives structured tool outputs</text>
    <text x="15" y="103" font-family="sans-serif" font-size="11" fill="#CBD5E1">Enforces non-advice guardrails</text>
    <text x="15" y="125" font-family="monospace" font-size="10" font-weight="bold" fill="#00E676">✓ Hallucination-Free</text>

    <!-- Operational Telemetry Node -->
    <rect x="0" y="170" width="200" height="150" rx="14" fill="url(#cardGrad)" stroke="#3B82F6" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="185" width="36" height="36" rx="8" fill="#3B82F6" fill-opacity="0.2"/>
    <text x="33" y="209" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#60A5FA">⚡</text>
    <text x="60" y="202" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">REST API Router</text>
    <text x="60" y="218" font-family="monospace" font-size="10" fill="#94A3B8">POST /api/mcp/tools</text>
    <text x="15" y="255" font-family="sans-serif" font-size="11" fill="#CBD5E1">Tracks latency (p50: 120ms)</text>
    <text x="15" y="273" font-family="sans-serif" font-size="11" fill="#CBD5E1">Logs tool execution stats</text>
    <text x="15" y="295" font-family="monospace" font-size="10" font-weight="bold" fill="#38BDF8">✓ NeonDB / SQLite Log</text>

    <!-- Database Storage Node -->
    <rect x="0" y="340" width="200" height="120" rx="14" fill="url(#cardGrad)" stroke="#F59E0B" stroke-width="1.5" filter="url(#shadow)"/>
    <rect x="15" y="355" width="36" height="36" rx="8" fill="#F59E0B" fill-opacity="0.2"/>
    <text x="33" y="379" text-anchor="middle" font-family="sans-serif" font-size="18" fill="#FBBF24">🗄️</text>
    <text x="60" y="372" font-family="sans-serif" font-size="14" font-weight="bold" fill="#FFFFFF">NeonDB Postgres</text>
    <text x="60" y="388" font-family="monospace" font-size="10" fill="#94A3B8">Portfolios & Audits</text>
    <text x="15" y="425" font-family="sans-serif" font-size="11" fill="#CBD5E1">Holdings, feedback & logs</text>
    <text x="15" y="445" font-family="monospace" font-size="10" font-weight="bold" fill="#FCD34D">✓ JSONB Schemas</text>
  </g>

  <!-- Central Dispatcher Arrows -->
  <path d="M 255 195 L 290 195 L 290 350 L 330 350" stroke="#8B5CF6" stroke-width="2" stroke-dasharray="4,4" fill="none"/>
  <path d="M 255 350 L 330 350" stroke="#3B82F6" stroke-width="2.5" fill="none"/>
  <path d="M 255 400 L 290 400 L 290 350 L 330 350" stroke="#F59E0B" stroke-width="2" stroke-dasharray="4,4" fill="none"/>

  <!-- Right: 7 Governed MCP Tool Cards -->
  <g transform="translate(340, 120)">
    <!-- Container Box -->
    <rect x="0" y="0" width="620" height="460" rx="16" fill="#101726" stroke="#223049" stroke-width="1.5"/>
    <text x="25" y="30" font-family="sans-serif" font-size="12" font-weight="800" fill="#94A3B8" letter-spacing="1">
      REGISTERED TYPED TOOLS & DISPATCH HANDLERS
    </text>

    <!-- Tool 1: lookup_portfolio -->
    <g transform="translate(20, 45)">
      <rect width="280" height="85" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="10" width="24" height="24" rx="6" fill="#00E676" fill-opacity="0.15"/>
      <text x="22" y="27" text-anchor="middle" font-size="12" fill="#00E676">📁</text>
      <text x="42" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF">1. lookup_portfolio</text>
      <rect x="215" y="12" width="55" height="18" rx="4" fill="#00E676" fill-opacity="0.15"/>
      <text x="242" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00E676">PORTFOLIO</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8">Fetches normalized holdings, weights &</text>
      <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#94A3B8">snapshot from NeonDB / local fallback.</text>
    </g>

    <!-- Tool 2: validate_portfolio_completeness -->
    <g transform="translate(315, 45)">
      <rect width="285" height="85" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="10" width="24" height="24" rx="6" fill="#00E676" fill-opacity="0.15"/>
      <text x="22" y="27" text-anchor="middle" font-size="12" fill="#00E676">🛡️</text>
      <text x="42" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">2. validate_portfolio_completeness</text>
      <rect x="220" y="12" width="55" height="18" rx="4" fill="#00E676" fill-opacity="0.15"/>
      <text x="247" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#00E676">PORTFOLIO</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8">Validates mandatory fields (shares, avg buy,</text>
      <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#94A3B8">current price) before AI processing.</text>
    </g>

    <!-- Tool 3: fetch_market_quotes -->
    <g transform="translate(20, 145)">
      <rect width="280" height="85" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="10" width="24" height="24" rx="6" fill="#3B82F6" fill-opacity="0.15"/>
      <text x="22" y="27" text-anchor="middle" font-size="12" fill="#3B82F6">📈</text>
      <text x="42" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF">3. fetch_market_quotes</text>
      <rect x="225" y="12" width="45" height="18" rx="4" fill="#3B82F6" fill-opacity="0.15"/>
      <text x="247" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#60A5FA">MARKET</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8">Fetches live LTP, 52W High/Low and day</text>
      <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#94A3B8">ranges via yfinance market feeds.</text>
    </g>

    <!-- Tool 4: fetch_historical_ohlc -->
    <g transform="translate(315, 145)">
      <rect width="285" height="85" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="10" width="24" height="24" rx="6" fill="#3B82F6" fill-opacity="0.15"/>
      <text x="22" y="27" text-anchor="middle" font-size="12" fill="#3B82F6">🕯️</text>
      <text x="42" y="24" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF">4. fetch_historical_ohlc</text>
      <rect x="230" y="12" width="45" height="18" rx="4" fill="#3B82F6" fill-opacity="0.15"/>
      <text x="252" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#60A5FA">MARKET</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8">Pulls candlestick historical OHLC series</text>
      <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#94A3B8">for interactive chart visualization.</text>
    </g>

    <!-- Tool 5: fetch_ticker_sentiment_news -->
    <g transform="translate(20, 245)">
      <rect width="280" height="85" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="10" width="24" height="24" rx="6" fill="#EC4899" fill-opacity="0.15"/>
      <text x="22" y="27" text-anchor="middle" font-size="12" fill="#EC4899">📰</text>
      <text x="42" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">5. fetch_ticker_sentiment_news</text>
      <rect x="235" y="12" width="35" height="18" rx="4" fill="#EC4899" fill-opacity="0.15"/>
      <text x="252" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#F472B6">NEWS</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8">Extracts recent headlines & classifies</text>
      <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#94A3B8">sentiment (Positive / Negative / Neutral).</text>
    </g>

    <!-- Tool 6: compute_portfolio_metrics -->
    <g transform="translate(315, 245)">
      <rect width="285" height="85" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="10" width="24" height="24" rx="6" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="22" y="27" text-anchor="middle" font-size="12" fill="#8B5CF6">⚙️</text>
      <text x="42" y="24" font-family="monospace" font-size="11" font-weight="bold" fill="#FFFFFF">6. compute_portfolio_metrics</text>
      <rect x="215" y="12" width="60" height="18" rx="4" fill="#8B5CF6" fill-opacity="0.15"/>
      <text x="245" y="25" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#C4B5FD">ANALYTICS</text>
      <text x="12" y="52" font-family="sans-serif" font-size="10" fill="#94A3B8">Calculates P&L, stock contributions,</text>
      <text x="12" y="68" font-family="sans-serif" font-size="10" fill="#94A3B8">drawdowns, volatility and benchmark Beta.</text>
    </g>

    <!-- Tool 7: calculate_risk_alerts -->
    <g transform="translate(20, 345)">
      <rect width="580" height="95" rx="10" fill="#182236" stroke="#2B3A58" stroke-width="1"/>
      <rect x="10" y="12" width="24" height="24" rx="6" fill="#FF5252" fill-opacity="0.15"/>
      <text x="22" y="29" text-anchor="middle" font-size="12" fill="#FF5252">🚨</text>
      <text x="42" y="28" font-family="monospace" font-size="12" font-weight="bold" fill="#FFFFFF">7. calculate_risk_alerts</text>
      <rect x="505" y="15" width="65" height="18" rx="4" fill="#FF5252" fill-opacity="0.15"/>
      <text x="537" y="28" text-anchor="middle" font-family="monospace" font-size="9" font-weight="bold" fill="#FF8A80">GOVERNANCE</text>
      <text x="12" y="58" font-family="sans-serif" font-size="10" fill="#94A3B8">Evaluates prudential thresholds: >40% single sector concentration (Critical: >60%),</text>
      <text x="12" y="74" font-family="sans-serif" font-size="10" fill="#94A3B8">annualized volatility >22%, and historical maximum drawdown alerts (>15%).</text>
    </g>
  </g>
</svg>
