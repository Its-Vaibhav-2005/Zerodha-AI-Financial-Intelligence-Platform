services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zerodha-ai-platform
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - HOST=0.0.0.0
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - NEON_DATABASE_URL=${NEON_DATABASE_URL:-}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-zerodha-ai-super-secret-key-2026}
      - ALPHA_VANTAGE_API_KEY=${ALPHA_VANTAGE_API_KEY:-}
      - KITE_CONNECT_API_KEY=${KITE_CONNECT_API_KEY:-}
      - MCP_SERVER_PORT=5000
      - MCP_PROTOCOL_VERSION=2025-06-18
    env_file:
      - path: .env
        required: false
    restart: unless-stopped
    volumes:
      - app_data:/app/data

volumes:
  app_data:
    driver: local
